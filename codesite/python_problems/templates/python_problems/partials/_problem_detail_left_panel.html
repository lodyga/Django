<div class="mb-2 p-2">
  <div class="col sticky-top">
    <div class="row-auto mb-1">
      <a class="btn btn-secondary px-3 py-0 mb-2" href="{{ next_url }}">Back</a>
    </div>
    <div class="row-auto mb-1">
      <button type="button"
              class="btn btn-secondary px-3 py-1 mb-2"
              data-bs-toggle="collapse"
              data-bs-target="#related">Related problems</button>
      <div id="related" class="collapse">
        <div class="box">
          <ul>
            {% for related in related_problems %}
              <li>
                <a class="btn btn-sm px-1 py-1 mb-2 text-truncate text-nowrap w-100 text-start"
                   href="{% url 'python_problems:problem-detail' related.slug solution.language.name %}"
                   role="button">{{ related.title }}</a>
              </li>
            {% endfor %}
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
