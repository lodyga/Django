<aside class="ai-assistant-panel">
  <div class="ai-assistant-controls d-flex align-items-center gap-1 mb-3">
    <div class="btn-group btn-group-sm" role="tablist" aria-label="Sidebar panels">
      <button class="btn btn-primary"
              id="aiAssistantTab"
              type="button"
              role="tab"
              aria-controls="aiContainer"
              aria-selected="true">AI Assistant</button>
      <button class="btn btn-outline-secondary"
              id="appearanceTab"
              type="button"
              role="tab"
              aria-controls="appearanceContainer"
              aria-selected="false">Appearance</button>
    </div>
    <div class="d-flex gap-1 ms-auto">
      <button class="btn btn-outline-secondary btn-sm"
              id="aiAssistantVisibilityButton"
              type="button"
              aria-controls="aiContainer appearanceContainer"
              aria-expanded="true"
              aria-label="Hide sidebar"
              title="Hide sidebar">
        <i class="fas fa-outdent" id="aiAssistantVisibilityIcon" aria-hidden="true"></i>
      </button>
      <button class="btn btn-outline-secondary btn-sm"
              id="aiAssistantWidthButton"
              type="button"
              aria-controls="aiContainer appearanceContainer"
              aria-label="Extend sidebar"
              title="Extend sidebar">
        <i class="fas fa-comment-dots" id="aiAssistantWidthIcon" aria-hidden="true"></i>
      </button>
    </div>
  </div>
  <div class="card ai-assistant-card" id="aiContainer" role="tabpanel" aria-labelledby="aiAssistantTab">
    <div class="card-header d-flex align-items-center justify-content-between gap-2">
      <div class="d-flex align-items-center gap-2">
        <i class="fas fa-robot text-primary" aria-hidden="true"></i>
        <h2 class="h5 mb-0">AI assistant</h2>
      </div>
      <div class="dropdown">
        <button class="btn btn-sm btn-outline-secondary dropdown-toggle"
                id="chooseAiModelBtn"
                type="button"
                data-bs-toggle="dropdown"
                aria-expanded="false">Cohere</button>
        <ul class="dropdown-menu dropdown-menu-end"
            aria-labelledby="chooseAiModelBtn"
            id="chooseAiModelMenu">
          <li><button class="dropdown-item" type="button" data-model="cohere">Cohere</button></li>
          <li><button class="dropdown-item" type="button" data-model="mistral">Mistral</button></li>
          <li><button class="dropdown-item" type="button" data-model="gemini">Gemini</button></li>
        </ul>
      </div>
    </div>
    <div class="card-body">
      <label class="visually-hidden" for="chatBox">Conversation</label>
      <textarea id="chatBox"
                name="chat_box"
                class="form-control ai-chat-history"
                placeholder="Your conversation will appear here."
                readonly></textarea>
      <label class="visually-hidden" for="chatUserInput">Message to AI assistant</label>
      <textarea class="form-control ai-chat-composer"
                id="chatUserInput"
                placeholder="Ask a question…"
                rows="2"></textarea>
    </div>
    <div class="card-footer d-flex justify-content-end gap-2">
      {% if ai_problem_context %}
        <button class="btn btn-outline-info btn-sm"
                type="button"
                id="aiSolveProblemButton"
                title="Ask the selected AI model to solve this problem in its current language.">
          <i class="fas fa-lightbulb me-1" aria-hidden="true"></i>Solve problem
        </button>
      {% endif %}
      <button class="btn btn-primary btn-sm" type="button" id="sendButton">
        <span id="aiSendButtonLabel">Send</span>
        <span id="aiSendButtonSpinner" class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
      </button>
    </div>
  </div>
  <section class="card appearance-card d-none"
           id="appearanceContainer"
           role="tabpanel"
           aria-labelledby="appearanceTab"
           hidden>
    <div class="card-header">
      <h2 class="h5 mb-0">Appearance</h2>
    </div>
    <div class="card-body">
      <fieldset class="appearance-setting">
        <legend class="form-label">Text</legend>
        <div class="btn-group w-100" role="group" aria-label="Text size">
          <input class="btn-check" id="appearanceTextSmall" name="appearanceText" data-appearance-setting="text" type="radio" value="small">
          <label class="btn btn-outline-secondary" for="appearanceTextSmall">Small</label>
          <input class="btn-check" id="appearanceTextStandard" name="appearanceText" data-appearance-setting="text" type="radio" value="standard">
          <label class="btn btn-outline-secondary" for="appearanceTextStandard">Standard</label>
          <input class="btn-check" id="appearanceTextLarge" name="appearanceText" data-appearance-setting="text" type="radio" value="large">
          <label class="btn btn-outline-secondary" for="appearanceTextLarge">Large</label>
        </div>
      </fieldset>
      <fieldset class="appearance-setting">
        <legend class="form-label">Width</legend>
        <div class="btn-group w-100" role="group" aria-label="Content width">
          <input class="btn-check" id="appearanceWidthStandard" name="appearanceWidth" data-appearance-setting="width" type="radio" value="standard">
          <label class="btn btn-outline-secondary" for="appearanceWidthStandard">Standard</label>
          <input class="btn-check" id="appearanceWidthWide" name="appearanceWidth" data-appearance-setting="width" type="radio" value="wide">
          <label class="btn btn-outline-secondary" for="appearanceWidthWide">Wide</label>
        </div>
      </fieldset>
      <fieldset class="appearance-setting">
        <legend class="form-label">Color</legend>
        <div class="btn-group w-100" role="group" aria-label="Color theme">
          <input class="btn-check" id="appearanceColorAutomatic" name="appearanceColor" data-appearance-setting="color" type="radio" value="automatic">
          <label class="btn btn-outline-secondary" for="appearanceColorAutomatic">Automatic</label>
          <input class="btn-check" id="appearanceColorLight" name="appearanceColor" data-appearance-setting="color" type="radio" value="light">
          <label class="btn btn-outline-secondary" for="appearanceColorLight">Light</label>
          <input class="btn-check" id="appearanceColorDark" name="appearanceColor" data-appearance-setting="color" type="radio" value="dark">
          <label class="btn btn-outline-secondary" for="appearanceColorDark">Dark</label>
        </div>
      </fieldset>
    </div>
  </section>
</aside>
