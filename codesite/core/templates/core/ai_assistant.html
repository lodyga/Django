<aside class="ai-assistant-panel">
  <div class="ai-assistant-controls d-flex justify-content-end gap-1 mb-3">
    <button class="btn btn-outline-secondary btn-sm"
            id="aiAssistantVisibilityButton"
            type="button"
            aria-controls="aiContainer"
            aria-expanded="true"
            aria-label="Hide AI assistant"
            title="Hide AI assistant">
      <i class="fas fa-outdent" id="aiAssistantVisibilityIcon" aria-hidden="true"></i>
    </button>
    <button class="btn btn-outline-secondary btn-sm"
            id="aiAssistantWidthButton"
            type="button"
            aria-controls="aiContainer"
            aria-label="Extend AI assistant"
            title="Extend AI assistant">
      <i class="fas fa-comment-dots" id="aiAssistantWidthIcon" aria-hidden="true"></i>
    </button>
  </div>
  <div class="card ai-assistant-card" id="aiContainer">
    <div class="card-header d-flex align-items-center justify-content-between gap-2">
      <div class="d-flex align-items-center gap-2">
        <i class="fas fa-robot text-primary" aria-hidden="true"></i>
        <h2 class="h5 mb-0">AI assistant</h2>
      </div>
      <div class="dropdown">
        <button class="btn btn-sm btn-outline-secondary dropdown-toggle"
                id="chooseAiModelBtn"
                type="button"
                data-bs-toggle="dropdown"
                aria-expanded="false">Cohere</button>
        <ul class="dropdown-menu dropdown-menu-end"
            aria-labelledby="chooseAiModelBtn"
            id="chooseAiModelMenu">
          <li><button class="dropdown-item" type="button" data-model="cohere">Cohere</button></li>
          <li><button class="dropdown-item" type="button" data-model="mistral">Mistral</button></li>
          <li><button class="dropdown-item" type="button" data-model="gemini">Gemini</button></li>
        </ul>
      </div>
    </div>
    <div class="card-body">
      <label class="visually-hidden" for="chatBox">Conversation</label>
      <textarea id="chatBox"
                name="chat_box"
                class="form-control ai-chat-history"
                placeholder="Your conversation will appear here."
                readonly></textarea>
      <label class="visually-hidden" for="chatUserInput">Message to AI assistant</label>
      <textarea class="form-control ai-chat-composer"
                id="chatUserInput"
                placeholder="Ask a question…"
                rows="2"></textarea>
    </div>
    <div class="card-footer d-flex justify-content-end gap-2">
      {% if ai_problem_context %}
        <button class="btn btn-outline-info btn-sm"
                type="button"
                id="aiSolveProblemButton"
                title="Ask the selected AI model to solve this problem in its current language.">
          <i class="fas fa-lightbulb me-1" aria-hidden="true"></i>Solve problem
        </button>
      {% endif %}
      <button class="btn btn-primary btn-sm" type="button" id="sendButton">
        <span id="aiSendButtonLabel">Send</span>
        <span id="aiSendButtonSpinner" class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</aside>
